name: CI
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install --index-url https://download.pytorch.org/whl/cpu torch && pip install -r requirements-dev.txt
      - run: ruff check src backend tests
      - run: mypy
      # leakage, 36-unit reference, MinT coherence, API auth/roles/rotation, tiny end-to-end training (synthetic panel)
      - run: pytest -q
        env: {MLFLOW_DISABLE_AGENT_HINT: "1"}
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci && npm run build
        working-directory: frontend
  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env && docker compose build
